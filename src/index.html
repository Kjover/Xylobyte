
<body>
  <h1>Xylo</h1>

  <div class="Xylobyte">
    <button>C</button></small></button>
    <button>D</button></small></button>
    <button>E</button></small></button>
    <button>F</button></small></button>
    <button>G</button></small></button>
    <button>A</button></small></button>
    <button>B</button></small></button>
    <button>C</button></small></button>
  </div>


  <style>
  .note{position:fixed;font-style:normal;animation:f 1s linear}
  @keyframes f{to{transform:translateY(-100px);opacity:0}}
    
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family:serif;
      text-align: center;
    }
    button small {
    display: block;
    margin-top: 10px;
    opacity: .6;
    font-size: 14px;
    }

    
h1 {
      margin: 40px 0;
    }
    .xylophone {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 8px;
    }

    button {
      width: 65px;
      border: 0;
      border-radius: 8px;
      background: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: .08s;
    }
    button:nth-child(1) { background: #ff595e; height: 220px; }
    button:nth-child(2) { background: #ff924c; height: 205px; }
    button:nth-child(3) { background: #ffca3a; height: 190px; }
    button:nth-child(4) { background: #8ac926; height: 175px; }
    button:nth-child(5) { background: #52b788; height: 160px; }
    button:nth-child(6) { background: #1982c4; height: 145px; }
    button:nth-child(7) { background: #4267ac; height: 130px; }
    button:nth-child(8) { background: #9b5de5; height: 115px; }

    

  button:active{transform:translateY(6px)}
  </style>

<script>
const N=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],K="ASDFGHJK",a=new AudioContext(),b=document.querySelectorAll("button"),g=a.createGain();

g.gain.value=.25;g.connect(a.destination);

function play(i){
 if(a.state=="suspended")a.resume();
 let x=a.createOscillator(),n=document.createElement("span");

 x.frequency.value=N[i];x.connect(g);

 n.className="note";n.innerHTML="&#9834;";n.style.left=b[i].offsetLeft+"px";n.style.top=b[i].offsetTop+"px";document.body.append(n);

 setTimeout(()=>n.remove(),700);

 x.start();x.stop(a.currentTime+.2);
}

b.forEach((x,i)=>x.onclick=()=>play(i));

document.onkeydown=e=>{let i=K.indexOf(e.key.toUpperCase());if(i>=0)play(i)}
</script>
